# Lima configuration for Sandstorm development
# Generated by lima-spk

# Sandstorm requires x86_64 architecture
arch: x86_64
vmType: qemu
timezone: ""

# Match the Debian Trixie environment configured in box.toml
images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
    arch: x86_64

# Resource allocation
cpus: 4
memory: "3GiB"
disk: "20GiB"

# Disable containerd/nerdctl (not needed for Sandstorm)
containerd:
  system: false
  user: false

# Mounts:
# - The project directory is mounted at /opt/app via --set when running `lima-spk vm up`
# - ~/.sandstorm is mounted for sharing keys and caches
mounts:
  - location: "~/.sandstorm"
    mountPoint: "/host-dot-sandstorm"
    writable: true

# Forward the Sandstorm dev port
portForwards:
  - guestPort: 6090
    hostIP: "127.0.0.1"
    hostPort: 6090
  # Do not auto-forward unrelated guest services discovered during provisioning.
  - guestIP: "127.0.0.1"
    proto: "any"
    guestPortRange: [1, 65535]
    ignore: true

# Provision the VM with Sandstorm
provision:
  # Grant the Lima user access to the system journal before cloud-init creates it.
  - mode: boot
    script: |
      for file in /etc/group /etc/gshadow; do
        [ -f "$file" ] || continue
        line="$(grep '^systemd-journal:' "$file")" || continue
        members="${line##*:}"
        case ",$members," in
          *,{{.User}},*) ;;
          *)
            sed -i \
              -e '/^systemd-journal:/s/$/,{{.User}}/' \
              -e '/^systemd-journal:[^:]*:[^:]*:,/s/:,/:/' \
              "$file"
            ;;
        esac
      done
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if [ -f /opt/app/.sandstorm/global-setup.sh ]; then
        bash /opt/app/.sandstorm/global-setup.sh
      fi
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if [ -f /opt/app/.sandstorm/setup.sh ]; then
        bash /opt/app/.sandstorm/setup.sh
      fi

# Use 'vagrant' user for compatibility with vagrant-spk scripts
user:
  name: vagrant

# SSH configuration
ssh:
  localPort: 0
  forwardAgent: false

# Message shown after VM starts
message: |
  Your Sandstorm dev environment is running.
  Access it at http://local.sandstorm.io:6090

  To SSH: lima-spk vm ssh
  To stop: lima-spk vm halt
  To delete: lima-spk vm destroy
