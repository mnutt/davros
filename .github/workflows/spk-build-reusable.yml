name: SPK Build Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      pack_mode:
        required: true
        type: string
      spk_output_path:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
    secrets:
      sandstorm_keyring_b64:
        required: true

jobs:
  build-spk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - name: Cache ~/.cache/lima
        uses: actions/cache@v4
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.sandstorm_keyring_b64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret sandstorm_keyring_b64"
            exit 1
          fi
          mkdir -p "$HOME/.sandstorm"
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm/sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm/sandstorm-keyring"

      - name: Normalize sandstorm-files.list
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          awk '!/opt\/app\/dist\/assets\//' .sandstorm/sandstorm-files.list > "$tmpfile"
          mv "$tmpfile" .sandstorm/sandstorm-files.list

      - name: Download lima-spk
        run: git clone --branch spk-pack-dev https://github.com/mnutt/vagrant-spk /tmp/vagrant-spk

      - name: Add /tmp/vagrant-spk to PATH
        run: echo "/tmp/vagrant-spk" >> "$GITHUB_PATH"

      - name: Initialize lima vm
        run: /tmp/vagrant-spk/lima-spk vm up

      - name: Build app
        run: yarn build

      - name: Build dependencies
        run: printf "sg sandstorm -c '/opt/app/.sandstorm/build.sh'\nexit\n" | lima-spk vm ssh

      - name: Build SPK
        run: |
          set -euo pipefail
          mkdir -p build
          if [ "${{ inputs.pack_mode }}" = "test" ]; then
            lima-spk pack --dev --set-version "${GITHUB_SHA}" "${{ inputs.spk_output_path }}"
          else
            lima-spk pack "${{ inputs.spk_output_path }}"
          fi

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.spk_output_path }}
