name: Build SPK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "24.13.0"

jobs:
  build-spk:
    name: Build davros.spk
    runs-on: ubuntu-24.04
    container:
      image: node:24-bookworm
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    timeout-minutes: 30

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Build app artifacts in workspace
        run: |
          set -euo pipefail
          yarn install --immutable
          yarn build:server
          yarn build

      - name: Install Sandstorm tooling (spk)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl ca-certificates rsync sudo clang pkg-config capnproto libcapnp-dev make
          curl -fsSL https://install.sandstorm.io > /tmp/install-sandstorm.sh
          bash /tmp/install-sandstorm.sh -d -e -p 6090 || true

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.SANDSTORM_KEYRING_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret SANDSTORM_KEYRING_B64"
            exit 1
          fi
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm-keyring"

      - name: Prepare /opt/app for spk source paths
        run: |
          set -euo pipefail
          mkdir -p /opt
          rm -rf /opt/app
          mkdir -p /opt/app
          rsync -a --delete --exclude='.git' --exclude='node_modules' "$GITHUB_WORKSPACE"/ /opt/app/
          chown -R "$(id -un):$(id -gn)" /opt/app

      - name: Normalize sandstorm-files.list
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          awk '!/opt\/app\/dist\/assets\//' .sandstorm/sandstorm-files.list > "$tmpfile"
          mv "$tmpfile" .sandstorm/sandstorm-files.list

      - name: Build artifacts for SPK
        run: |
          set -euo pipefail
          export USER="${USER:-$(id -un)}"
          chmod +x /opt/app/.sandstorm/compile_helper.sh
          /opt/app/.sandstorm/compile_helper.sh
          test -d /opt/app/dist
          test -x /opt/app/sandstorm-integration/bin/getPublicId
          test -f /opt/app/output/app.js

      - name: Build SPK
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd .sandstorm
            /opt/sandstorm/latest/bin/spk pack ../build/davros-${GITHUB_SHA}.spk
          )
          cp build/davros-${GITHUB_SHA}.spk davros.spk

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: davros-spk-${{ github.sha }}
          path: |
            build/davros-${{ github.sha }}.spk
            davros.spk
