name: Build SPK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "24.13.0"

jobs:
  build-spk:
    name: Build davros.spk
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build app artifacts
        run: |
          set -euo pipefail
          yarn build
          yarn build:server

      - name: Install Sandstorm tooling (spk)
        run: |
          set -euo pipefail
          curl -fsSL https://install.sandstorm.io > /tmp/install-sandstorm.sh
          sudo bash /tmp/install-sandstorm.sh -d -e -p 6090

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.SANDSTORM_KEYRING_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret SANDSTORM_KEYRING_B64"
            exit 1
          fi
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm-keyring"

      - name: Prepare /opt/app for spk source paths
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          sudo rm -rf /opt/app
          sudo mkdir -p /opt/app
          sudo rsync -av --delete --exclude='.git' "$GITHUB_WORKSPACE"/ /opt/app/
          sudo chown -R "$USER:$USER" /opt/app

      - name: Normalize sandstorm-files.list
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          awk '!/opt\/app\/dist\/assets\//' .sandstorm/sandstorm-files.list > "$tmpfile"
          mv "$tmpfile" .sandstorm/sandstorm-files.list

      - name: Build SPK
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd .sandstorm
            /opt/sandstorm/latest/bin/spk pack ../build/davros-${GITHUB_SHA}.spk
          )
          cp build/davros-${GITHUB_SHA}.spk davros.spk

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: davros-spk-${{ github.sha }}
          path: |
            build/davros-${{ github.sha }}.spk
            davros.spk
