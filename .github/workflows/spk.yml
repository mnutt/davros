name: Build SPK

on:
  push:
  #  branches:
  #    - master
  #    - main
  pull_request:
  workflow_dispatch:

jobs:
  build-spk:
    name: Build spk
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup

      - name: Cache ~/.cache/lima
        uses: actions/cache@v4
        with:
         path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

          yarn build

      - name: Restore Sandstorm signing keyring
        env:
          SANDSTORM_KEYRING_B64: ${{ secrets.SANDSTORM_KEYRING_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${SANDSTORM_KEYRING_B64:-}" ]; then
            echo "::error::Missing required secret SANDSTORM_KEYRING_B64"
            exit 1
          fi
          printf '%s' "$SANDSTORM_KEYRING_B64" | base64 --decode > "$HOME/.sandstorm-keyring"
          chmod 600 "$HOME/.sandstorm-keyring"

      - name: Normalize sandstorm-files.list
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          awk '!/opt\/app\/dist\/assets\//' .sandstorm/sandstorm-files.list > "$tmpfile"
          mv "$tmpfile" .sandstorm/sandstorm-files.list

      - name: Download lima-spk
        run: git clone https://github.com/sandstorm-io/vagrant-spk /tmp/vagrant-spk

      - name: Initialize lima vm
        run: |
          /tmp/vagrant-spk/lima-spk vm up

      - name: Build SPK
        run: |
          set -euo pipefail
          mkdir -p build
          /tmp/vagrant-spk/lima-spk pack build/davros-${GITHUB_SHA}.spk

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: davros-spk-${{ github.sha }}
          path: |
            build/davros-${{ github.sha }}.spk
