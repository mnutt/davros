name: Build SPK

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-test-spk:
    name: Build Test SPK
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    uses: ./.github/workflows/spk-build-reusable.yml
    with:
      environment_name: test-spk
      pack_mode: test
      spk_output_path: build/davros-test-${{ github.sha }}.spk
      artifact_name: davros-test-spk-${{ github.sha }}
    secrets:
      sandstorm_keyring_b64: ${{ secrets.SANDSTORM_TEST_KEYRING_B64 }}

  build-release-spk:
    name: Build Release SPK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/spk-build-reusable.yml
    with:
      environment_name: release-spk
      pack_mode: release
      spk_output_path: build/davros-${{ github.sha }}.spk
      artifact_name: davros-release-spk-${{ github.sha }}
    secrets:
      sandstorm_keyring_b64: ${{ secrets.SANDSTORM_KEYRING_B64 }}
