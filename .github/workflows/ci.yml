name: CI

on: [push, pull_request]

env:
  NODE_VERSION: '24.13.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint

  test-app:
    name: App Tests
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test:ember

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache litmus
        id: cache-litmus
        uses: actions/cache@v4
        with:
          path: ~/litmus
          key: ${{ runner.os }}-litmus

      - name: Build litmus
        if: steps.cache-litmus.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/litmus
          cd ~/litmus
          wget http://www.webdav.org/neon/litmus/litmus-0.13.tar.gz
          tar -zxf litmus-0.13.tar.gz
          cd litmus-0.13
          sed -i -e "s/T(propfind_invalid2),//g" src/props.c
          ./configure && make

      - name: Test WebDAV (allow)
        run: |
          mkdir -p dist tmp/dav-test
          touch dist/index.html
          STORAGE_PATH=tmp/dav-test PORT=6489 node app.js > /dev/null &

          cd ~/litmus/litmus-0.13
          make URL=http://127.0.0.1:6489/dav check || true

      - name: Test server
        if: always()
        run: yarn test:server
